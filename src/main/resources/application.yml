spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fuelspot_db?serverTimezone=Asia/Seoul}

    username: ${DB_USERNAME:root}

    password: ${DB_PASSWORD}

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

opinet:
  api-key: ${OPINET_API_KEY}