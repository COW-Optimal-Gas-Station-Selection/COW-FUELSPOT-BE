name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. AWS 권한 설정 (보안 그룹 조작용)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2 # 서울 리전

      # 2. 현재 깃허브 액션 러너의 공인 IP 가져오기
      - name: Get Github Action IP
        id: ip
        uses: haythem/public-ip@v1.3

      # 3. 보안 그룹에 IP 추가 (문 열기 )
      - name: Add Github Action IP to Security group
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fuelspot-app:latest

      # 4. EC2에 접속해서 배포 (문이 열렸으니 접속 가능)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker stop fuelspot-app || true
            docker rm fuelspot-app || true
            docker rmi ${{ secrets.DOCKER_USERNAME }}/fuelspot-app:latest || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/fuelspot-app:latest
            
            # 실행! (비밀번호 등은 Secrets에서 주입)
            docker run -d \
              --name fuelspot-app \
              --network host \
              -e TZ=Asia/Seoul \
              -e OPINET_API_KEY=${{ secrets.OPINET_API_KEY }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              ${{ secrets.DOCKER_USERNAME }}/fuelspot-app:latest

      # 5. [중요] 작업이 끝나면 IP 제거 (문 닫기 ) - 실패해도 무조건 실행
      - name: Remove Github Action IP from Security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32