name: Deploy to EC2

on:
  push:
    branches:
      - main
      - chore/cicd-setting

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. AWS 권한 설정 (보안 그룹 조작용)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2 # 서울 리전

      # 2. 현재 깃허브 액션 러너의 공인 IP 가져오기
      - name: Get Github Action IP
        id: ip
        uses: haythem/public-ip@v1.3

      # 3. 보안 그룹에 IP 추가
      - name: Add Github Action IP to Security group
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fuelspot-app:latest

      # 4. EC2에 접속해서 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. 도커 네트워크 생성 (앱과 Redis가 통신할 방 만들기)
            docker network create fuelspot-net || true
            
            # 2. Redis 컨테이너 실행 (없을 때만 실행)
            if ! docker ps | grep -q "fuelspot-redis"; then
              docker run -d --name fuelspot-redis \
                --network fuelspot-net \
                -p 6379:6379 \
                redis:alpine
            fi
            
            # 3. 기존 앱 컨테이너 정리
            docker stop fuelspot-app || true
            docker rm fuelspot-app || true
            
            # 4. 최신 이미지 받기
            docker pull ${{ secrets.DOCKER_USERNAME }}/fuelspot-app:latest
            
            # 5. 앱 실행 (환경변수 추가 & 네트워크 연결)
            docker run -d \
              --name fuelspot-app \
              --network fuelspot-net \
              -p 8080:8080 \
              -e TZ=Asia/Seoul \
              -e OPINET_API_KEY=${{ secrets.OPINET_API_KEY }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e MAIL_USERNAME=${{ secrets.MAIL_USERNAME }} \
              -e MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }} \
              -e REDIS_HOST=fuelspot-redis \
              -e REDIS_PORT=6379 \
              ${{ secrets.DOCKER_USERNAME }}/fuelspot-app:latest

      # 5. [중요] 작업이 끝나면 IP 제거 (문 닫기 ) - 실패해도 무조건 실행
      - name: Remove Github Action IP from Security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32