name: Deploy to EC2

on:
  push:
    branches:
      - main
      - chore/cicd-setting

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 빌드 추가 (jar 파일 생성이 필요할 수 있으므로 추가)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 1. AWS 권한 설정 (보안 그룹 조작용)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 2. 현재 깃허브 액션 러너의 공인 IP 가져오기
      - name: Get Github Action IP
        id: ip
        uses: haythem/public-ip@v1.3

      # 3. 보안 그룹에 IP 추가
      - name: Add Github Action IP to Security group
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jonghyeok03/fuelspot-app:latest

      # 4. EC2에 접속해서 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            DOCKER_USER="jonghyeok03"
            
            # 2. 도커 네트워크 생성
            docker network create fuelspot-net || true

            # 3. Redis 실행
            if ! docker ps -a --format '{{.Names}}' | grep -q "^fuelspot-redis$"; then
              docker run -d --name fuelspot-redis --network fuelspot-net -p 6379:6379 --restart unless-stopped redis:alpine
            fi

            # 4. MySQL 실행
            if ! docker ps -a --format '{{.Names}}' | grep -q "^fuelspot-db$"; then
              docker run -d --name fuelspot-db --network fuelspot-net \
                -e MYSQL_ROOT_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                -e MYSQL_DATABASE=fuelspot_db \
                --restart unless-stopped mysql:8.0
            fi
            
            docker start fuelspot-db fuelspot-redis || true
            
            # DB 켜질 때까지 10초 대기
            sleep 10

            # 기존 앱 삭제
            docker rm -f fuelspot-app || true
            docker pull $DOCKER_USER/fuelspot-app:latest
            
            # 앱 실행
            docker run -d \
              --name fuelspot-app \
              --network fuelspot-net \
              -p 8080:8080 \
              --restart unless-stopped \
              -e TZ=Asia/Seoul \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://fuelspot-db:3306/fuelspot_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8" \
              -e SPRING_DATASOURCE_USERNAME="root" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e OPINET_API_KEY="${{ secrets.OPINET_API_KEY }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
              -e MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
              -e KAKAO_REST_API_KEY="${{ secrets.KAKAO_REST_API_KEY }}" \
              -e REDIS_HOST="fuelspot-redis" \
              -e REDIS_PORT=6379 \
              $DOCKER_USER/fuelspot-app:latest
            
            docker image prune -f

      # 5. 작업이 끝나면 IP 제거 - 실패해도 무조건 실행
      - name: Remove Github Action IP from Security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32